</text>
<rect x="680" y="698" width="560" height="102" rx="14" fill="#FEF3C7"/>
<text x="704" y="729" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#854D0E" font-weight="400" text-anchor="start">
